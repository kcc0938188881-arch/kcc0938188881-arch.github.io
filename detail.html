<script>
const listings = {
  1: { tag: "建地", title: "安南高級社區 840坪建地", loc: "台南市安南區 · 高級住宅社區", desc: "基地840坪，位於台南安南區成熟高級住宅社區內，鄰地已為整齊的獨棟與雙併住宅。最大優勢在南科通勤條件：經北外環線進入南科園區車程約12至15分鐘，台積電擴廠基地、台灣歷史博物館與亞太棒球村皆在生活圈範圍。沿台17線、國道8號可快速連結台南市區、安平與高鐵沙崙站。基地形狀完整、地勢平坦，臨路條件良好，適合規劃低密度別墅、雙併或精緻集合住宅，面積規模足以形成獨立社區。學區、市場與醫療資源皆在近距離。適合建設公司開發自售社區，或投資者參與南科人才住宅需求。", images: ["land-annan-1.jpg", "land-annan-2.jpg", "land-annan-3.jpg", "land-annan-4.jpg"] },
  2: { tag: "建地", title: "高雄美術館 近捷運精選商業地", loc: "高雄市鼓山區龍中段 · 近捷運站", desc: "基地336.87坪，臨高雄鼓山區裕誠路，面寬約76公尺、深度約14.5公尺，是典型臨大路帶狀商業地。完整76公尺臨路面寬等同一整排連續店面的展示長度，招牌與櫥窗曝光效果在鼓山一帶難以複製。基地緊鄰新建高層住宅與既有集團總部大樓，捷運站步行可達，周邊餐飲、零售與金融服務聚集，租金水準有支撐。深度適合規劃連棟店面、汽車展示中心或大型餐飲，可搭配上層辦公配置。適合零售品牌設立高雄旗艦點、開發商規劃店面出售，或投資者持有收租。", images: ["land-ksart-1.jpg", "land-ksart-2.jpg", "land-ksart-3.jpg", "land-ksart-4.jpg"] },
  3: { tag: "工業地", title: "仁德 近萬坪甲種工業地", loc: "台南市仁德區 · 甲種工業用地", desc: "基地近萬坪，台南仁德區甲種工業用地，是南台灣少見的大面積完整工業腹地。鄰地可見建材廠、氣體與化工儲槽場、大型物流車隊調度場，區域對高強度工業使用高度相容，無鄰避抗爭風險。甲種工業用地容許化學、金屬、機械等高汙染製程，並可設置危險品倉儲，這類許可條件在都市周邊極為稀有。基地平坦完整，可規劃大跨距廠房、大型槽區或貨櫃調度場，臨路可容納聯結車全天候進出。往國道1號仁德交流道、台南機場與高雄港皆便捷。適合化工、氣體、金屬表面處理業設廠。", images: ["ind-rende-1.jpg", "ind-rende-2.jpg", "ind-rende-3.jpg", "ind-rende-4.jpg"] },
  4: { tag: "廠房", title: "雲林科技園 丁建7638坪", loc: "雲林科技工業園區 · 丁種建築用地", desc: "基地7638坪，雲林科技工業園區內丁種建築用地，園區道路、供電供水與污水處理系統均已完備。現況為既成營運廠區，內含大跨距鋼構廠房、天車吊掛系統（2.8噸與10.3噸級橋式起重機）、完整生產動線與大面積水泥前庭，屋頂並已設置太陽能發電。廠房淨高與跨距充足，適合金屬加工、表面處理、大型機械組裝，接手後可直接沿用既有結構設備，大幅縮短建廠時程。園區主幹道連結台78線與國道1號，往台中、嘉義與台南皆便捷。適合企業承接營運中廠區或擴充產能。", images: ["fac-yunlin-1.jpg", "fac-yunlin-2.jpg", "fac-yunlin-3.jpg", "fac-yunlin-4.jpg", "fac-yunlin-5.jpg", "fac-yunlin-6.jpg"] },
  5: { tag: "商辦", title: "近衛武營國家音樂廳 商務旅館", loc: "高雄市鳳山區 · 衛武營藝文特區", desc: "標的位於高雄鳳山區衛武營藝文特區旁，為現成商務旅館建物，圓弧玻璃帷幕立面辨識度高，臨大路轉角能見度極佳。衛武營國家藝術文化中心全年演出檔期密集，加上衛武營都會公園假日人流，形成藝文與觀光雙軌需求，住房與餐飲營收具長期支撐。捷運橘線與多線公車可達，往高雄車站、巨蛋商圈與小港機場皆便捷。建物已具旅館營運格局，客房與垂直動線完整，可延續營運或重新定位為精品旅宿、長租公寓。適合旅宿業者取得現成營運資產，或投資者持有收租。", images: ["com-wuying-1.jpg", "com-wuying-2.jpg", "com-wuying-3.jpg", "com-wuying-4.jpg"] },
  6: { tag: "廠房", title: "南區 2992坪廠房", loc: "台南市南區 · 現成廠房", desc: "標的為台南南區2992坪現成廠房，完整臨接20米新義路，路寬足以容納聯結車雙向會車。基地方正完整，內含兩棟平行大跨距廠房、附屬辦公與倉儲，前庭為大面積水泥硬鋪面，可作貨車迴轉、貨櫃暫存與員工停車。周邊為既成工業聚落，鄰地多為運作中的製造廠與物流設施，無鄰避抗爭顧慮。往台南市區、國道1號與台86線皆便捷，往南連結仁德高雄，往北承接南科供應鏈。廠房結構可直接沿用，免除建廠前置期與建照時程。適合製造業擴廠或物流業設置配銷中心。", images: ["fac-nanqu-1.jpg", "fac-nanqu-2.jpg", "fac-nanqu-3.jpg", "fac-nanqu-4.jpg"] },
  7: { tag: "廠房", title: "台南仁德保安工業區 丁建廠房", loc: "台南市仁德區保安段 · 丁種建築用地", desc: "標的位於台南仁德保安工業區，丁種建築用地，內含營運中大跨距鋼構廠房。廠內配置雙軌橋式天車，額定荷重2.8噸與10.3噸，並具多台節升吊車，適合金屬加工、機械組裝、模具製造等需重物吊掛的製程。保安工業區協力廠商密集，技術人力與外包資源供給穩定。緊鄰台1線與保安車站，往台南市區、仁德交流道與台南機場皆便捷。丁種用地可直接申請廠房建照，無需變更程序；現有結構與天車設備可延續使用，接手即可投產。適合金屬機械業擴充產能或投資收租。", images: ["fac-baoan-1.jpg", "fac-baoan-2.jpg", "fac-baoan-3.jpg", "fac-baoan-4.jpg", "fac-baoan-5.jpg"] },
  8: { tag: "建地", title: "台南沙崙南科四期 3305坪建地", loc: "台南市歸仁區沙崙 · 未來南科四期", desc: "基地3305坪，台南歸仁沙崙、未來南科四期範圍周邊，三面臨路，可分別規劃人車進出動線。鄰近沙崙智慧綠能科學城已完工進駐，中央研究院南部院區、成大醫院沙崙分院與高鐵台南站均在生活圈範圍。沿台86線可直達國道1號與3號，高鐵沙崙站的商務移動條件是本區最大差異點。三千坪級完整腹地在此區已不易取得，可規劃企業總部、研發辦公、養生機構、旅宿或住宅社區分期開發。基地平坦完整，退縮浪費少。適合企業設立南部總部或開發商整體規劃。", images: ["land-shalun-1.jpg", "land-shalun-2.jpg", "land-shalun-3.jpg", "land-shalun-4.jpg", "land-shalun-5.jpg", "land-shalun-6.jpg", "land-shalun-7.jpg", "land-shalun-8.jpg", "land-shalun-9.jpg", "land-shalun-10.jpg", "land-shalun-11.jpg", "land-shalun-12.jpg"] },
  9: { tag: "建地", title: "南科 692坪特定專用區用地", loc: "台南市新市區 · 緊鄰南科", desc: "基地692坪，特定專用區用地，緊鄰南科園區——至南科園區車程約2分鐘、南科宿舍區2分鐘、台積電廠區5分鐘、群創科技5分鐘、國道8號約8分鐘，是少見能同時貼近園區與快速道路的規模型用地。基地方正完整、臨路良好，水電管線已臨接，取得後可直接進入規劃階段。特定專用區用途彈性，可規劃研發辦公、產業服務、宿舍或商業設施，直接承接園區溢出需求。南科持續擴廠，周邊服務型空間長期供不應求。適合企業設置園區服務據點或興建員工宿舍。", images: ["land-nk692-1.jpg", "land-nk692-2.jpg", "land-nk692-3.jpg", "land-nk692-4.jpg"] },
  10: { tag: "建地", title: "安南區九份子優質建地", loc: "台南市安南區 · 九份子重劃區", desc: "基地位於台南安南區九份子重劃區，公共設施、道路、綠帶與水電排水均已到位，取得後可直接申請建照。九份子以低密度與綠地為規劃主軸，區內住四之一（50%/180%）與住六之一（50%/250%）分區並存，開發強度選擇彈性大。周邊成交行情明確：住六之一近年落在每坪53.8萬至69.36萬，住四之一約42.1萬至58.6萬，價格帶清晰且穩定走升。台17線與北外環線構成雙向快速通道，是南科通勤族與市區換屋族的重疊需求區。適合開發集合住宅或別墅社區。", images: ["land-jiufen-1.jpg", "land-jiufen-2.jpg", "land-jiufen-3.jpg", "land-jiufen-4.jpg"] },
  11: { tag: "建地", title: "台南麻豆 340坪乙建", loc: "台南市麻豆區 · 乙種建築用地", desc: "基地340坪，台南麻豆都市計畫內乙種建築用地，建蔽率60%、容積率180%。形狀近長方形，寬約28公尺、深約50公尺，完整臨接12公尺寬計畫道路，臨路面寬足以規劃多個獨立出入口，適合連棟街屋或雙併住宅切割銷售。都內建地程序單純：無需變更用地、公設已到位、水電臨接基地，取得後可直接進入設計與建照階段。兩側為既有住宅，市場、學校與醫療步行可達，屬麻豆核心生活圈。340坪規模適合中小型建商快速開發去化，資金壓力低、周轉期短。", images: ["land-madou-1.jpg", "land-madou-2.jpg", "land-madou-3.jpg", "land-madou-4.jpg"] },

const id = new URLSearchParams(location.search).get('id');
const d = listings[id] || listings[1];
document.getElementById('bcTitle').textContent = d.title;
document.getElementById('dTag').textContent = d.tag;
document.getElementById('dTitle').textContent = d.title;

document.title = d.title + '｜義鼎不動產';
if (d.imgRes && window.__resources && window.__resources[d.imgRes]) {
  const ph = document.getElementById('imgPlaceholder');
  const img = document.createElement('img');
  img.src = window.__resources[d.imgRes]; img.alt = d.title;
  ph.replaceWith(img);
}
if (d.images && d.images.length) {
  const ph = document.getElementById('imgPlaceholder');
  const imgEl = document.createElement('img');
  imgEl.alt = d.title;
  ph.replaceWith(imgEl);
  let idx = 0;
  const dotsWrap = document.getElementById('imgDots');
  const render = () => {
    imgEl.src = d.images[idx];
    dotsWrap.innerHTML = '';
    d.images.forEach((_, i) => {
      const dot = document.createElement('span');
      if (i === idx) dot.className = 'active';
      dotsWrap.appendChild(dot);
    });
  };
  render();
  if (d.images.length > 1) {
    document.getElementById('imgPrev').classList.add('show');
    document.getElementById('imgNext').classList.add('show');
    dotsWrap.classList.add('show');
    document.getElementById('imgPrev').addEventListener('click', () => { idx = (idx - 1 + d.images.length) % d.images.length; render(); });
    document.getElementById('imgNext').addEventListener('click', () => { idx = (idx + 1) % d.images.length; render(); });
  }
}
